# Installs a published release with the commands from the README, on every
# supported platform, and checks that the installed binary runs.
# Called by release.yml (generated by dist) after the release is announced.
name: Smoke install

on:
  workflow_call:
    inputs:
      plan:
        description: The dist manifest of the release
        required: true
        type: string

permissions: {}

env:
  TAG: ${{ fromJson(inputs.plan).announcement_tag }}

jobs:
  install:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install (shell)
        if: runner.os != 'Windows'
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/guysenpai/generate-license/releases/download/${TAG}/generate-license-installer.sh" | sh

      - name: Check (shell)
        if: runner.os != 'Windows'
        run: |
          bin="$HOME/.local/bin/generate-license"
          version="$("$bin" --version)"
          echo "$version"
          [ "$version" = "generate-license ${TAG#v}" ]
          text="$("$bin" MIT --holder "Smoke Test" --year 2026 -o -)"
          case "$text" in
            "MIT License"*) ;;
            *) echo "unexpected output: $text"; exit 1 ;;
          esac

      - name: Install (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -c "irm https://github.com/guysenpai/generate-license/releases/download/${env:TAG}/generate-license-installer.ps1 | iex"

      - name: Check (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "$env:USERPROFILE\.local\bin\generate-license.exe"
          $version = & $bin --version
          Write-Output $version
          if ($version -ne "generate-license $($env:TAG -replace '^v', '')") {
            throw "unexpected version: $version"
          }
          $text = (& $bin MIT --holder "Smoke Test" --year 2026 -o -) -join "`n"
          if (-not $text.StartsWith("MIT License")) {
            throw "unexpected output: $text"
          }

  alpine:
    name: alpine (musl)
    runs-on: ubuntu-latest
    container: alpine:latest
    defaults:
      run:
        shell: sh -e {0}
    steps:
      - name: Install curl
        run: apk add --no-cache curl

      - name: Install
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/guysenpai/generate-license/releases/download/${TAG}/generate-license-installer.sh" | sh

      - name: Check
        run: |
          bin="$HOME/.local/bin/generate-license"
          version="$("$bin" --version)"
          echo "$version"
          [ "$version" = "generate-license ${TAG#v}" ]
          text="$("$bin" MIT --holder "Smoke Test" --year 2026 -o -)"
          case "$text" in
            "MIT License"*) ;;
            *) echo "unexpected output: $text"; exit 1 ;;
          esac
